name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/utrockets-consolidation-plan-sjdkst
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site, embeds, and link check
        run: PATH_PREFIX=/reinvent/ npm run build
      - name: Install Chromium for accessibility audit
        run: npx playwright install chromium
      - name: Accessibility audit (WCAG 2.1 AA, zero violations)
        run: npm run a11y
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
